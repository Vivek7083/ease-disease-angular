<div class="canvas-root" aria-hidden="true" [style.background]="canvasColor()"></div>
<div class="ambient-field" aria-hidden="true"></div>
<app-flow-lines aria-hidden="true" />

<app-wordmark class="chrome chrome-wordmark" />

<app-cta-pill
  class="chrome chrome-cta"
  [class.visible]="bookingCta.visible()"
  [style.opacity]="bookingCta.opacity()"
  [label]="bookingCta.label()"
  [durationLabel]="plan.duration"
  [price]="plan.price"
  [originalPrice]="plan.originalPrice"
  revealKey="chrome"
  variant="primary"
  [compact]="true"
  (pressed)="bookingCta.trigger()"
/>

<app-scroll-progress class="chrome chrome-progress" />

<router-outlet />
