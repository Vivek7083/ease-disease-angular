<div class="results-intro reveal" [appScrollReveal]="0">
  <app-eyebrow-label text="We empower you," />
  <h2 id="results-heading" class="t-display">When YOU take the right action, <span class="accent">YOU transform</span></h2>
</div>

<ul class="results-list" #list [style.--stem-progress]="stemProgress()">
  @for (outcome of outcomes; track outcome.title; let i = $index) {
    <li class="results-item reveal" [appScrollReveal]="(i % 3) * 120">
      <span class="results-num" aria-hidden="true">{{ '0' + (i + 1) }}</span>
      <h3 class="results-title">{{ outcome.title }}</h3>
      <p class="results-body">{{ outcome.body }}</p>
    </li>
  }
</ul>
